schema_version: 1
as_of: '2026-08-02'
methodology:
  purpose: 一次資料に明示された最新の賞与・一時金集計を、対象範囲と集計方法を保持したまま比較する。
  comparability_policy: 集計主体、対象企業・組合、季別・年間、金額・月数が異なるため、異なる行を同一母集団のランキングとして扱わない。
  company_policy: 集計値は個社の確認値へ転用せず、個社値は当該会社または労組の一次資料に明示された場合のみ採用する。
  revision_policy: 第1回集計は暫定値として保持し、最終集計公表後に置換または履歴化する。
