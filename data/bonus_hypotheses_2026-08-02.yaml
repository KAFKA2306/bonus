schema_version: 1
as_of: '2026-08-02'
methodology:
  purpose: 固定Universe 30社すべてについて、一次情報で確定できない賞与月数を検証可能な仮説レンジとして提示する。
  separation_policy: 確認事実と仮説推定を別レイヤーで保持し、推定値をverified集計へ混入させない。
  interval_policy: 単一点ではなく下限・中心値・上限を示し、前提と反証条件を必須とする。
  confidence_policy: confidence.scoreは0から1。一次情報の直接性、旧調査との整合性、制度変更リスク、記述曖昧性を反映する。
  aggregation_policy: 仮説中心値の平均は参考指標であり、確認済み月数平均とは別に表示する。
