schema_version: 1
as_of: '2026-08-02'
methodology:
  purpose: 個社一次資料で年間賞与月数を確定できない場合でも、旧個社調査を会社事前分布、連合2026最終集計の業種別年間一時金を実測アンカーとして、全30社へ定量推定を付与する。
  model_type: empirical_bayes_shrinkage
  central_formula: 推定中心値 = 会社重み × 旧個社中心値 + (1 - 会社重み) × 2026年業種実測月数。
  weight_formula: 会社重み = clamp(基礎重み + 信頼度係数 × 旧信頼度 + 一次資料加点 - セクター推定減点, 下限, 上限)。
  interval_formula: 下限・上限も会社事前レンジと業種実測値±業種不確実幅を同じ会社重みで合成する。
  amount_formula: 参考換算額 = 業種実測年間金額 ÷ 業種実測月数 × 個社推定月数。個社の実額ではなく、同業種の平均基本月額を仮定した参考値とする。
  verified_override_policy: 一次資料で支給回数・算定方式・最低月数を確認できた場合は、その値を推定構造または下限へ優先適用する。
  disclosure_policy: 推定値、実測アンカー、会社重み、前提、反証条件を同時表示し、確認済み事実と混同させない。
parameters:
  base_company_weight: 0.45
  confidence_multiplier: 0.50
  verified_evidence_bonus: 0.15
  sector_only_penalty: 0.05
  minimum_company_weight: 0.55
  maximum_company_weight: 0.90
  minimum_sector_band_months: 0.35
