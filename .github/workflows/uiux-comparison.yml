name: Validate bonus comparison UI

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/validate_pages.py"
      - "scripts/validate_comparison_ui.py"
      - "scripts/generate_pages_data.py"
      - "tests/**"
      - ".github/workflows/uiux-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Run model regression tests
        run: python -m unittest discover -s tests -v

      - name: Regenerate public JSON
        run: python scripts/generate_pages_data.py

      - name: Validate quantified Pages contract
        run: python scripts/validate_pages.py

      - name: Validate comparison UI contract
        run: python scripts/validate_comparison_ui.py

      - name: Validate JavaScript syntax
        run: node --check docs/app.js
