name: Deploy bonus dashboard

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "data/verified_bonus_facts_*.yaml"
      - "scripts/validate_pages.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "data/verified_bonus_facts_*.yaml"
      - "scripts/validate_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - run: python scripts/generate_bonus_summary.py --check
      - run: python scripts/validate_pages.py
      - name: Check static entry points
        run: test -s docs/index.html && test -s docs/styles.css && test -s docs/app.js && test -s docs/data/bonus.json
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
