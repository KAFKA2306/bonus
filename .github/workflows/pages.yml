name: Deploy Nikkei 225 quantified bonus dashboard

on:
  push:
    branches: [main]
    paths: ["docs/**", "data/**", "nikkei225_bonus_survey_2024_en.yaml", "scripts/**", "tests/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["docs/**", "data/**", "nikkei225_bonus_survey_2024_en.yaml", "scripts/**", "tests/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bonus-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate verified facts
        run: python scripts/generate_bonus_summary.py --check
      - name: Generate Nikkei 225 quantified payload
        run: |
          python scripts/generate_pages_data.py
          python scripts/expand_nikkei225.py
      - name: Generate public benchmark API v1
        run: python scripts/build_benchmark_api.py
      - name: Audit Nikkei 225 quantitative payload
        run: python scripts/validate_nikkei225.py
      - name: Check benchmark API contract
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/api/v1/manifest.json
          test -s docs/api/v1/benchmarks.json
          test -s docs/api/v1/benchmarks.csv
          test -s docs/api/v1/facets.json
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          root = Path('docs/api/v1')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          payload = json.loads((root / 'benchmarks.json').read_text(encoding='utf-8'))
          assert manifest['record_count'] == len(payload['benchmarks']) == 11
          assert len({row['id'] for row in payload['benchmarks']}) == 11
          with (root / 'benchmarks.csv').open(encoding='utf-8', newline='') as handle:
              assert sum(1 for _ in csv.DictReader(handle)) == 11
          for name, meta in manifest['distributions'].items():
              data = (root / name).read_bytes()
              assert len(data) == meta['bytes']
              assert hashlib.sha256(data).hexdigest() == meta['sha256']
          PY
      - name: Check JavaScript syntax
        run: node --check docs/app.js
      - name: Check static entry points
        run: test -s docs/index.html && test -s docs/styles.css && test -s docs/app.js && test -s docs/data/bonus.json

  publish-gh-pages:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Generate Nikkei 225 quantified bundle and benchmark API
        run: |
          python scripts/generate_pages_data.py
          python scripts/expand_nikkei225.py
          python scripts/validate_nikkei225.py
          python scripts/build_benchmark_api.py
      - name: Publish generated bundle to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="${RUNNER_TEMP}/bonus-gh-pages"
          rm -rf "${publish_dir}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --force origin gh-pages:gh-pages
          git worktree add "${publish_dir}" gh-pages
          find "${publish_dir}" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a docs/. "${publish_dir}/"
          touch "${publish_dir}/.nojekyll"
          printf '%s\n' "${GITHUB_SHA}" > "${publish_dir}/.source-commit"
          git -C "${publish_dir}" add -A
          if git -C "${publish_dir}" diff --cached --quiet; then
            echo "gh-pages already matches the generated bundle"
          else
            git -C "${publish_dir}" commit -m "Deploy Nikkei 225 bonus dashboard from ${GITHUB_SHA::12}"
            git -C "${publish_dir}" push origin gh-pages
          fi
