name: Deploy quantified bonus dashboard

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "data/verified_bonus_facts_*.yaml"
      - "data/source_survey_*.yaml"
      - "data/quantitative_benchmarks_*.yaml"
      - "data/bonus_hypotheses_*.yaml"
      - "data/company_estimation_model_*.yaml"
      - "nikkei225_bonus_survey_2024_en.yaml"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "data/verified_bonus_facts_*.yaml"
      - "data/source_survey_*.yaml"
      - "data/quantitative_benchmarks_*.yaml"
      - "data/bonus_hypotheses_*.yaml"
      - "data/company_estimation_model_*.yaml"
      - "nikkei225_bonus_survey_2024_en.yaml"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bonus-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate verified facts
        run: python scripts/generate_bonus_summary.py --check
      - name: Generate quantified Pages JSON
        run: python scripts/generate_pages_data.py
      - name: Audit quantified Pages bundle
        run: python scripts/validate_pages.py
      - name: Check JavaScript syntax
        run: node --check docs/app.js
      - name: Check static entry points
        run: test -s docs/index.html && test -s docs/styles.css && test -s docs/app.js && test -s docs/data/bonus.json

  publish-gh-pages:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Generate quantified bundle
        run: python scripts/generate_pages_data.py
      - name: Publish generated bundle to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="${RUNNER_TEMP}/bonus-gh-pages"
          rm -rf "${publish_dir}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --force origin gh-pages:gh-pages
          git worktree add "${publish_dir}" gh-pages
          find "${publish_dir}" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a docs/. "${publish_dir}/"
          touch "${publish_dir}/.nojekyll"
          printf '%s\n' "${GITHUB_SHA}" > "${publish_dir}/.source-commit"
          git -C "${publish_dir}" add -A
          if git -C "${publish_dir}" diff --cached --quiet; then
            echo "gh-pages already matches the generated bundle"
          else
            git -C "${publish_dir}" commit -m "Deploy quantified bonus dashboard from ${GITHUB_SHA::12}"
            git -C "${publish_dir}" push origin gh-pages
          fi

  verify-live:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: publish-gh-pages
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Regenerate expected public bundle
        run: python scripts/generate_pages_data.py
      - name: Audit deployed dashboard
        run: python scripts/audit_live_pages.py --attempts 18 --delay 5
