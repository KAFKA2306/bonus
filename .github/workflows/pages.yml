name: Deploy bonus dashboard

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "data/verified_bonus_facts_*.yaml"
      - "scripts/generate_pages_data.py"
      - "scripts/validate_pages.py"
      - "tests/test_generate_pages_data.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "data/verified_bonus_facts_*.yaml"
      - "scripts/generate_pages_data.py"
      - "scripts/validate_pages.py"
      - "tests/test_generate_pages_data.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate verified facts
        run: python scripts/generate_bonus_summary.py --check
      - name: Generate Pages JSON from latest snapshot
        run: python scripts/generate_pages_data.py
      - name: Audit Pages bundle
        run: python scripts/validate_pages.py
      - name: Check JavaScript syntax
        run: node --check docs/app.js
      - name: Check static entry points
        run: test -s docs/index.html && test -s docs/styles.css && test -s docs/app.js && test -s docs/data/bonus.json
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: deploy
    env:
      SITE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Regenerate expected public data
        run: python scripts/generate_pages_data.py
      - name: Download deployed site with propagation retries
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 5 --max-time 30 "$base/" -o /tmp/index.html
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 5 --max-time 30 "$base/styles.css" -o /tmp/styles.css
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 5 --max-time 30 "$base/app.js" -o /tmp/app.js
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 5 --max-time 30 "$base/data/bonus.json" -o /tmp/bonus.json
      - name: Verify deployed bytes and build marker
        run: |
          set -euo pipefail
          grep -F 'name="bonus-build" content="verified-pages-v2"' /tmp/index.html
          grep -F 'Bonus Evidence Atlas' /tmp/index.html
          cmp docs/styles.css /tmp/styles.css
          cmp docs/app.js /tmp/app.js
          cmp docs/data/bonus.json /tmp/bonus.json
