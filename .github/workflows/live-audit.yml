name: Audit live bonus dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  pull_request:
    paths:
      - scripts/audit_live_pages.py
      - tests/test_audit_live_pages.py
      - .github/workflows/live-audit.yml
  push:
    branches: [main]
    paths:
      - scripts/audit_live_pages.py
      - tests/test_audit_live_pages.py
      - .github/workflows/live-audit.yml

permissions:
  contents: read

jobs:
  audit-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run live audit tests
        run: python -m unittest tests.test_audit_live_pages -v
      - name: Audit deployed dashboard
        run: python scripts/audit_live_pages.py --attempts 12 --delay 5
