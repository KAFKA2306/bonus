name: Fix issue 15 amount sample mismatch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-issue-15.yml

permissions:
  contents: write
  issues: write

jobs:
  migrate-verify-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic migration dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Apply fail-closed source migration
        run: python scripts/migrate_issue_15.py
      - name: Run model and public-contract tests
        run: |
          python -m unittest discover -s tests -v
          python scripts/generate_bonus_summary.py --check
          python scripts/generate_pages_data.py
          python scripts/audit_amount_conversion.py
          python scripts/validate_pages.py
          node --check docs/app.js
      - name: Persist verification evidence
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          audit = json.loads(Path('audit/amount_conversion_diff.json').read_text(encoding='utf-8'))
          payload = {
              'schema_version': 1,
              'issue': 15,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'status': 'passed',
              'checks': [
                  'unittest discover',
                  'generate_bonus_summary --check',
                  'generate_pages_data',
                  'amount_conversion_diff audit',
                  'validate_pages',
                  'node --check docs/app.js',
              ],
              'company_count': audit['company_count'],
              'amount_available_company_count': audit['amount_available_company_count'],
              'amount_unavailable_company_count': audit['amount_unavailable_company_count'],
          }
          Path('audit/issue-15-verification.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Commit verified implementation and remove one-time machinery
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm scripts/migrate_issue_15.py .github/workflows/fix-issue-15.yml
          git add -A
          git commit -m 'fix: require matched samples for bonus amount conversion [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Close issue and delete merged branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close 15 --repo "$GITHUB_REPOSITORY" --reason completed \
            --comment 'Implemented matched-sample amount conversion, null/unavailable output for unmatched samples, public UI handling, 30-company difference audit, and passing regression/Pages checks.'
          git push origin --delete agent/fix-bonus-sample-mismatch || true
