name: Fix issue 15 amount sample mismatch

# One-time verification trigger: 2026-08-03-diagnostic
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-issue-15.yml

permissions:
  contents: write
  issues: write

jobs:
  migrate-verify-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic migration dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Run migration and all verification gates
        run: |
          set +e
          python scripts/migrate_issue_15.py > /tmp/migration.log 2>&1
          migration=$?

          unittest=125
          summary=125
          generate=125
          amount_audit=125
          pages=125
          javascript=125

          if [ "$migration" -eq 0 ]; then
            python -m unittest discover -s tests -v > /tmp/unittest.log 2>&1
            unittest=$?
            python scripts/generate_bonus_summary.py --check > /tmp/summary.log 2>&1
            summary=$?
            python scripts/generate_pages_data.py > /tmp/generate.log 2>&1
            generate=$?
            python scripts/audit_amount_conversion.py > /tmp/amount_audit.log 2>&1
            amount_audit=$?
            python scripts/validate_pages.py > /tmp/pages.log 2>&1
            pages=$?
            node --check docs/app.js > /tmp/javascript.log 2>&1
            javascript=$?
          else
            for name in unittest summary generate amount_audit pages javascript; do
              echo 'not run because migration failed' > "/tmp/$name.log"
            done
          fi
          set -e

          for name in migration unittest summary generate amount_audit pages javascript; do
            echo "===== $name ====="
            cat "/tmp/$name.log"
          done

          git add -A
          git diff --cached --binary > /tmp/issue-15-verified.patch
          git reset

          MIGRATION="$migration" UNITTEST="$unittest" SUMMARY="$summary" GENERATE="$generate" \
          AMOUNT_AUDIT="$amount_audit" PAGES="$pages" JAVASCRIPT="$javascript" python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          workspace = str(Path.cwd())
          names = (
              'migration',
              'unittest',
              'summary',
              'generate',
              'amount_audit',
              'pages',
              'javascript',
          )
          codes = {
              'migration': int(os.environ['MIGRATION']),
              'unittest': int(os.environ['UNITTEST']),
              'summary': int(os.environ['SUMMARY']),
              'generate': int(os.environ['GENERATE']),
              'amount_audit': int(os.environ['AMOUNT_AUDIT']),
              'pages': int(os.environ['PAGES']),
              'javascript': int(os.environ['JAVASCRIPT']),
          }

          def read_log(name: str) -> str:
              value = Path(f'/tmp/{name}.log').read_text(encoding='utf-8', errors='replace')
              return value.replace(workspace, '<workspace>')[-16000:]

          amount_summary = None
          amount_path = Path('audit/amount_conversion_diff.json')
          if amount_path.exists():
              amount = json.loads(amount_path.read_text(encoding='utf-8'))
              amount_summary = {
                  'company_count': amount.get('company_count'),
                  'amount_available_company_count': amount.get('amount_available_company_count'),
                  'amount_unavailable_company_count': amount.get('amount_unavailable_company_count'),
              }

          payload = {
              'schema_version': 1,
              'issue': 15,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'status': 'passed' if all(code == 0 for code in codes.values()) else 'failed',
              'exit_codes': codes,
              'amount_conversion_summary': amount_summary,
              'logs': {name: read_log(name) for name in names},
          }
          Path('/tmp/issue-15-verification.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Publish diagnostic evidence
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p audit
          cp /tmp/issue-15-verification.json audit/issue-15-verification.json
          git add audit/issue-15-verification.json
          git commit -m 'test: record issue 15 verification evidence [skip ci]' || true
          git push origin HEAD:main
      - name: Require every verification gate to pass
        run: python -c "import json,sys; data=json.load(open('audit/issue-15-verification.json')); sys.exit(0 if data['status']=='passed' else 1)"
      - name: Commit verified migration and remove one-time machinery
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git apply --index /tmp/issue-15-verified.patch
          git rm scripts/migrate_issue_15.py .github/workflows/fix-issue-15.yml
          git add -A
          git commit -m 'fix: require matched samples for bonus amount conversion [skip ci]'
          git push origin HEAD:main
      - name: Close issue and delete merged branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close 15 --repo "$GITHUB_REPOSITORY" --reason completed \
            --comment 'Implemented matched-sample amount conversion, null/unavailable output for unmatched samples, public UI handling, 30-company difference audit, and passing regression/Pages checks.'
          for branch in agent/fix-bonus-sample-mismatch ops/trigger-issue-15-verification ops/diagnose-issue-15; do
            git push origin --delete "$branch" || true
          done
