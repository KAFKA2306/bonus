name: Retrigger issue 15 build marker verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trigger-issue-15-build-marker.yml

permissions:
  contents: write

jobs:
  retrigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Touch the canonical verification workflow and self-delete
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/verify-issue-15-followup.yml')
          text = path.read_text(encoding='utf-8')
          marker = '# build-marker-fix-trigger: 2026-08-03\n'
          if marker not in text:
              text = marker + text
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/trigger-issue-15-build-marker.yml
          git add .github/workflows/verify-issue-15-followup.yml
          git commit -m 'ci: retrigger issue 15 build marker verification [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
