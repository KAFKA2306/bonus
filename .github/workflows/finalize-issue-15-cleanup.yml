name: Finalize issue 15 cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-issue-15-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete issue-related branches
        run: |
          set -euo pipefail
          for branch in \
            agent/fix-bonus-sample-mismatch \
            ops/trigger-issue-15-verification \
            ops/diagnose-issue-15 \
            agent/fix-issue-15-followup \
            agent/fix-issue-15-build-marker \
            agent/verify-issue-15-artifact \
            agent/apply-issue-15-verified-tree \
            ops/finalize-issue-15; do
            git push origin --delete "$branch" || true
          done
      - name: Remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/finalize-issue-15-cleanup.yml
          git commit -m 'chore: remove issue 15 cleanup workflow [skip ci]'
          git push origin HEAD:main
